pull_request_rules:

  # ── MERGE METHOD RULES ─────────────────────────────────────────

  - name: auto merge (regular)
    conditions:
      - base = develop
      - label != dont-merge
      - label != squash
      - "#approved-reviews-by >= 1"
      - check-success = CI
    actions:
      merge:
        method: merge

  - name: auto merge (squash)
    conditions:
      - base = develop
      - label = squash
      - "#approved-reviews-by >= 1"
      - check-success = CI
    actions:
      merge:
        method: squash

  # ── BACKPORT RULES ─────────────────────────────────────────────

  - name: backport to version-15-hotfix
    conditions:
      - merged
      - label = "backport version-15-hotfix"
    actions:
      backport:
        branches:
          - version-15-hotfix
        assignees:
          - "{{ author }}"

  - name: backport to version-15
    conditions:
      - merged
      - label = "backport version-15"
    actions:
      backport:
        branches:
          - version-15

  - name: backport to version-16-hotfix
    conditions:
      - merged
      - label = "backport version-16-hotfix"
    actions:
      backport:
        branches:
          - version-16-hotfix
        assignees:
          - "{{ author }}"

  - name: backport to version-16
    conditions:
      - merged
      - label = "backport version-16"
    actions:
      backport:
        branches:
          - version-16

  # ── AUTO-MERGE MERGIFY BACKPORT PRs ────────────────────────────

  - name: auto merge backport PRs from mergify bot
    conditions:
      - author = mergify[bot]
      - base ~= ^version-
      - check-success = CI
      - "#approved-reviews-by >= 1"
    actions:
      merge:
        method: merge

  # ── WRONG BRANCH GUARD ─────────────────────────────────────────

  - name: close PRs not from mergify on stable branches
    conditions:
      - base ~= ^version-
      - author != mergify[bot]
    actions:
      close: {}
      comment:
        message: |
          Hi @{{ author }}! Please open all PRs against the `develop` branch.
          Stable version branches only receive changes via automated backports.
          See our contributing guide for details.